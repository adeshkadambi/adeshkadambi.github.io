# One entry per project. Links are all optional: site | repo | paper | thesis | post.
# `papers` lists ids from publications.yaml; titles and links are pulled from there.

- id: egocentric-hand-use
  name: Wearable cameras for outpatient neurorehabilitation
  year: 2020–2026
  description: My PhD thesis. A clinical decision support system, co-designed with therapists, that uses egocentric video from wearable cameras to show how stroke and spinal cord injury patients use their hands at home, with an algorithm that classifies daily activities so therapists can quickly find relevant footage.
  links:
    thesis: https://hdl.handle.net/1807/153802
  papers: # listed oldest first; shown as Paper 1, 2, 3, ...
    - kadambi-2023-dashboard
    - kadambi-2025-adl-tnsre
    - kadambi-2026-therapist-perspectives
    - kadambi-2026-translational-framework

